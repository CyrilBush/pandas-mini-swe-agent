name: Doc Build and Upload

on:
  push:
    branches:
      - main
      - 3.0.x
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - 3.0.x
  workflow_dispatch:
    inputs:
      version:
        description: 'The pandas version to override'
        required: false
        type: string
      publish_prod:
        description: 'Publish to production'
        type: boolean
        default: false

defaults:
  run:
    shell: bash -euox pipefail {0}

permissions: {}


jobs:
  web_and_docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Determine version and production publishing mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION_OVERRIDE: ${{ inputs.version }}
          PUBLISH_PROD_INPUT: ${{ inputs.publish_prod }}
        run: |
          version="${VERSION_OVERRIDE:-}"
          if [[ -z "$version" && "$EVENT_NAME" == "push" ]]; then
            if [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?)$ ]]; then
              version="${BASH_REMATCH[1]}"
            fi
          fi

          publish_prod="${PUBLISH_PROD_INPUT:-false}"
          if [[ "$EVENT_NAME" == "push" && -n "$version" ]]; then
            publish_prod="true"
          elif [[ "$publish_prod" != "true" ]]; then
            publish_prod="false"
          fi

          if [[ "$publish_prod" == "true" ]]; then
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
              echo "::error::Production publishing requires a version without a leading 'v', in X.Y.Z or X.Y.ZrcN format; got '${version}'."
              exit 1
            fi
          fi

          if [[ -n "$version" ]]; then
            echo "PANDAS_VERSION=$version" >> "$GITHUB_ENV"
          fi
          echo "PUBLISH_PROD=$publish_prod" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up website and documentation environment
        uses: ./.github/actions/setup-pixi
        with:
          environment: docs-and-web

      - name: Build pandas in editable mode with warnings as errors
        run: |
          pixi run --environment docs-and-web build-pandas \
            --editable "--config-settings=setup-args=-Dwerror=true"

      - name: Run website tests
        run: pixi run --environment docs-and-web ci-test-website

      - name: Test DataFrame single-page documentation build
        run: pixi run --environment docs-and-web ci-test-single-page-doc pandas.DataFrame

      - name: Test Series single-page documentation build
        run: pixi run --environment docs-and-web ci-test-single-page-doc pandas.Series

      - name: Test notebook conversion
        run: |
          while IFS= read -r -d '' notebook; do
            pixi run --environment docs-and-web ci-test-nbconvert-doc-notebooks "$notebook"
          done < <(find doc/source -type f -name '*.ipynb' -print0)

      - name: Build website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pixi run --environment docs-and-web ci-build-website

      - name: Build HTML documentation
        run: pixi run --environment docs-and-web ci-build-documentation html

      - name: Build interactive terminal
        working-directory: web/interactive_terminal
        run: pixi run --environment docs-and-web ci-build-interactive_terminal

      - name: Compress HTML documentation
        run: pixi run --environment docs-and-web ci-build-documentation zip_html

      - name: Set up SSH authentication and host verification
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
        env:
          SERVER_SSH_KEY: ${{ secrets.server_ssh_key }}
          SERVER_IP: ${{ secrets.server_ip }}
          SERVER_HOST_PUBLIC_KEY: ${{ vars.server_host_public_key }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s %s\n' "$SERVER_IP" "$SERVER_HOST_PUBLIC_KEY" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy cheat sheet into website build
        run: cp doc/cheatsheet/Pandas_Cheat_Sheet.pdf web/build/Pandas_Cheat_Sheet.pdf

      - name: Move generated HTML documentation into website build
        run: mv doc/build/html web/build/docs

      - name: Upload website build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pandas-website
          path: web/build
          if-no-files-found: error
